# Generate Xcode project on a Mac: brew install xcodegen && xcodegen generate
# Then open MTDEEmailClient.xcworkspace or MTDEEmailClient.xcodeproj
name: MTDEEmailClient
options:
  bundleIdPrefix: com.mtde
  deploymentTarget:
    iOS: "16.0"
packages:
  MailCore2:
    url: https://github.com/MailCore/mailcore2
    branch: master
targets:
  MTDEEmailClient:
    type: application
    platform: iOS
    sources:
      - path: MTDEEmailClient
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mtde.emailclient
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_FILE: MTDEEmailClient/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MailCore2
        product: MailCore2
