name: Check Swift Compilation
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-14 # Specifically use macOS 14 for maximum compatibility with baseline Xcode environments
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4' # Keeps compilation reliable for standard Swift projects
        
      - name: Compile Code
        run: |
          xcodebuild -workspace *.xcworkspace -scheme MTDE EMAIL- IOS -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO || \
          xcodebuild -project *.xcodeproj -scheme YourAppName -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO
